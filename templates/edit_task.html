<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Task - Django ToDo App</title>
    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN"
      crossorigin="anonymous"
    ></script>
    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .edit-container {
        width: 100%;
        max-width: 650px;
        margin: 0 auto;
      }

      .edit-card {
        background: white;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        animation: slideIn 0.4s ease-out;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(-30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .edit-header {
        text-align: center;
        margin-bottom: 35px;
      }

      .edit-header h3 {
        color: #667eea;
        font-weight: 700;
        font-size: 2rem;
        margin-bottom: 10px;
      }

      .edit-header p {
        color: #6c757d;
        margin: 0;
        font-size: 1rem;
      }

      .form-label {
        color: #333;
        font-weight: 600;
        margin-bottom: 12px;
        font-size: 1rem;
      }

      .form-control {
        border-radius: 12px;
        border: 2px solid #e9ecef;
        padding: 15px 20px;
        font-size: 1rem;
        transition: all 0.3s ease;
        margin-bottom: 25px;
      }

      .form-control:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 0.25rem rgba(102, 126, 234, 0.25);
      }

      .btn-group-custom {
        display: flex;
        gap: 15px;
        margin-top: 10px;
      }

      .btn {
        border-radius: 12px;
        padding: 14px 30px;
        font-weight: 600;
        font-size: 1rem;
        transition: all 0.3s ease;
        border: none;
        flex: 1;
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
      }

      .btn-primary {
        background: #667eea;
      }

      .btn-primary:hover {
        background: #5568d3;
      }

      .btn-secondary {
        background: #6c757d;
      }

      .btn-secondary:hover {
        background: #5a6268;
      }

      .btn i {
        margin-right: 8px;
      }

      .back-link {
        text-align: center;
        margin-top: 25px;
      }

      .back-link a {
        color: white;
        text-decoration: none;
        font-weight: 500;
        font-size: 0.95rem;
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .back-link a:hover {
        color: #f8f9fa;
        transform: translateX(-5px);
      }

      /* Responsive Design */
      @media (max-width: 768px) {
        .edit-card {
          padding: 30px 25px;
        }

        .edit-header h3 {
          font-size: 1.6rem;
        }

        .btn-group-custom {
          flex-direction: column;
        }

        .btn {
          width: 100%;
        }
      }

      @media (max-width: 576px) {
        body {
          padding: 15px;
        }

        .edit-card {
          padding: 25px 20px;
        }

        .edit-header h3 {
          font-size: 1.4rem;
        }

        .form-control {
          padding: 12px 16px;
          font-size: 0.95rem;
        }

        .btn {
          padding: 12px 24px;
          font-size: 0.9rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="edit-container">
      <div class="edit-card">
        <div class="edit-header">
          <h3><i class="fa fa-pencil"></i> Edit Task</h3>
          <p>Update your task details below</p>
        </div>

        <form action="{% url 'edit_task' task.id %}" method="POST">
          {% csrf_token %}
          <div class="form-group">
            <label for="taskInput" class="form-label">
              <i class="fa fa-tasks"></i> Task Description
            </label>
            <input
              type="text"
              id="taskInput"
              name="task"
              class="form-control"
              placeholder="Enter your task..."
              value="{{ task.task }}"
              required
              autofocus
            />
          </div>

          <div class="btn-group-custom">
            <button type="submit" class="btn btn-primary">
              <i class="fa fa-check"></i> Update Task
            </button>
            <a href="{% url 'home' %}" class="btn btn-secondary">
              <i class="fa fa-times"></i> Cancel
            </a>
          </div>
        </form>
      </div>

      <div class="back-link">
        <a href="{% url 'home' %}">
          <i class="fa fa-arrow-left"></i> Back to Task List
        </a>
      </div>
    </div>
  </body>
</html>
